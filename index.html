<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Pipeline & Matching Engine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #1e293b;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .toolbar {
      margin: 16px 0;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-action {
      background: #15803d;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #166534;
    }
    .badge-count {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
    }
    .card-item {
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .btn-call {
      flex: 1;
      background: #1a4479;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-wa {
      flex: 1;
      background: #25D366;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-call:hover { opacity: 0.9; }
    .btn-wa:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📊 Produce Sales Pipeline</h2>

    <!-- Action Toolbar -->
    <div class="toolbar">
      <button class="btn-action" onclick="generateAndRenderPipeline()">
        ⚡ Generate Historical Matches
      </button>
      <span id="match-count-badge" class="badge-count"></span>
    </div>

    <!-- Target List Container -->
    <div id="list-pipeline">
      <div style="text-align:center; padding:40px; color:#94a3b8; font-weight:600;">
        Click "Generate Historical Matches" to process current stock against buyer history.
      </div>
    </div>
  </div>

  <script>
    // Global fallback store setup
    window.store = window.store || { stock: [], floor: [], buyers: [] };
    window.contactedBuyers = window.contactedBuyers || {};

    // 1. Realtime Firebase Sync for Strikethroughs Across All Devices
    function listenToDailyContactedStatus() {
      const todayStr = new Date().toISOString().split('T')[0];
      if (typeof firebase !== 'undefined' && firebase.database) {
        firebase.database().ref(`contacted_buyers/${todayStr}`).on('value', (snapshot) => {
          window.contactedBuyers = snapshot.val() || {};
          if (window.lastPipelineMatches) {
            renderPipelineCards(window.lastPipelineMatches);
          }
        });
      }
    }
    listenToDailyContactedStatus();

    // 2. Trigger Pipeline Generation
    function generateAndRenderPipeline() {
      const rawStock = (store.stock || []).concat(store.floor || []);
      const buyers = store.buyers || [];
      const todayDow = new Date().getDay();

      const filteredStock = typeof filterBySalesman === 'function' ? filterBySalesman(rawStock) : rawStock;
      const matches = runHistoricalBuyerMatch(filteredStock, buyers, todayDow);

      window.lastPipelineMatches = matches;
      renderPipelineCards(matches);
    }

    // 3. Strict Historical Buyer Matching Engine
    function runHistoricalBuyerMatch(stock, buyers, todayDow) {
      if (!stock || !buyers || !stock.length || !buyers.length) return [];

      // Rank buyers by spend/turnover (highest spenders first)
      const sortedBuyers = [...buyers].sort((a, b) => {
        const tA = Number(a.turnover || a.totalPrice || a.spend || 0);
        const tB = Number(b.turnover || b.totalPrice || b.spend || 0);
        return tB - tA;
      }).slice(0, 30); // Top 30 Buyers

      const results = [];

      sortedBuyers.forEach(buyer => {
        const historyComms = new Set();

        // Collect historical commodities from preferred items
        const prefsList = buyer.prefs || buyer.preferredItems || [];
        if (Array.isArray(prefsList)) {
          prefsList.forEach(p => {
            if (typeof p === 'string') historyComms.add(p.trim().toUpperCase());
            else if (Array.isArray(p.commodities)) p.commodities.forEach(c => historyComms.add(String(c).trim().toUpperCase()));
            else if (p.comm || p.commodity || p.product) historyComms.add(String(p.comm || p.commodity || p.product).trim().toUpperCase());
          });
        }

        // Collect historical commodities from slips / sales history
        const historyList = buyer.salesHistory || buyer.history || buyer.slips || [];
        if (Array.isArray(historyList)) {
          historyList.forEach(h => {
            const itemComm = h.product || h.commodity || h.item;
            if (itemComm) historyComms.add(String(itemComm).trim().toUpperCase());
          });
        }

        if (historyComms.size === 0) return; // Skip buyers without historical purchases

        const matchedItems = [];

        // Match available stock lines against historical list
        stock.forEach(item => {
          const stockQty = Number(item.qty || item.flr || item.qty_sort || item.qty_rec || 0);
          if (stockQty <= 0) return;

          const stockComm = String(item.commodity || item.product || '').trim().toUpperCase();
          if (!stockComm) return;

          let isMatch = false;
          historyComms.forEach(hc => {
            if (stockComm.includes(hc) || hc.includes(stockComm)) isMatch = true;
          });

          if (isMatch) {
            matchedItems.push({
              commodity: stockComm,
              pack: item.pack || '',
              size: item.size || '*',
              qty: stockQty,
              producer: item.producer || 'Unknown',
              displayText: `${stockComm} (${item.pack || ''} Size:${item.size || '*'}) - ${stockQty} available`
            });
          }
        });

        if (matchedItems.length > 0) {
          results.push({
            buyerId: String(buyer.name || buyer.id).replace(/[^a-zA-Z0-9]/g, '_'),
            buyerName: buyer.name,
            phone: buyer.phone || buyer.phoneNumber || '',
            turnover: Number(buyer.turnover || buyer.totalPrice || 0),
            matchedItems: matchedItems
          });
        }
      });

      return results;
    }

    // 4. Render Buyer Cards with Complete Produce List
    function renderPipelineCards(matches) {
      const container = document.getElementById('list-pipeline');
      const countBadge = document.getElementById('match-count-badge');
      if (!container) return;

      if (countBadge) countBadge.innerText = `${matches.length} matching buyers found`;

      if (matches.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8; font-weight:600;">No historical commodity matches found for current floor stock.</div>`;
        return;
      }

      const contactedMap = window.contactedBuyers || {};

      container.innerHTML = matches.map((m) => {
        const isContacted = !!contactedMap[m.buyerId];
        const cardStyle = isContacted 
          ? "opacity:0.55; background:#f1f5f9; border-left:4px solid #94a3b8; filter:grayscale(40%);" 
          : "background:#ffffff; border-left:4px solid #15803d; box-shadow:0 2px 8px rgba(0,0,0,0.05);";

        const nameStyle = isContacted 
          ? "text-decoration:line-through; color:#64748b;" 
          : "color:#0f172a;";

        return `
          <div class="card-item" id="card-${m.buyerId}" style="${cardStyle}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-weight:800; font-size:16px; ${nameStyle}">${m.buyerName}</span>
                ${isContacted ? `<span style="margin-left:8px; background:#e2e8f0; color:#475569; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px;">CONTACTED TODAY</span>` : ''}
              </div>
              <span style="font-size:11px; background:#f0fdf4; color:#166534; font-weight:700; padding:4px 8px; border-radius:6px;">
                ${m.matchedItems.length} Produce Match${m.matchedItems.length > 1 ? 'es' : ''}
              </span>
            </div>

            <!-- List of All Matching Stock Items for this Buyer -->
            <div style="margin-top:12px;">
              <label style="font-size:11px; font-weight:700; color:#475569; display:block; margin-bottom:6px;">MATCHED PRODUCE FOR TODAY:</label>
              <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:8px 12px; font-size:13px;">
                ${m.matchedItems.map(item => `
                  <div style="padding:3px 0; color:#334155; font-weight:600; display:flex; align-items:center; gap:6px;">
                    <span>📦</span> <span>${item.displayText}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Call & WhatsApp Action Buttons -->
            <div style="margin-top:14px; display:flex; gap:10px; align-items:center;">
              <button class="btn-call" onclick="triggerPhoneCall('${m.buyerId}', '${m.phone}')">
                📞 Call
              </button>
              
              <button class="btn-wa" onclick="triggerWhatsApp('${m.buyerId}', '${m.buyerName}', '${m.phone}')">
                💬 WhatsApp
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. Shared Contact Tracking System (Strikethrough Sync)
    function markBuyerAsContacted(buyerId) {
      const todayStr = new Date().toISOString().split('T')[0];
      
      if (!window.contactedBuyers) window.contactedBuyers = {};
      window.contactedBuyers[buyerId] = true;

      // Realtime Firebase DB update
      if (typeof firebase !== 'undefined' && firebase.database) {
        firebase.database().ref(`contacted_buyers/${todayStr}/${buyerId}`).set({
          contactedAt: firebase.database.ServerValue.TIMESTAMP,
          user: store?.userEmail || 'Salesman'
        });
      }

      // DOM fallback update
      const card = document.getElementById(`card-${buyerId}`);
      if (card) {
        card.style.opacity = "0.55";
        card.style.background = "#f1f5f9";
        card.style.borderLeft = "4px solid #94a3b8";
        card.style.filter = "grayscale(40%)";
        const nameEl = card.querySelector('span');
        if (nameEl) {
          nameEl.style.textDecoration = "line-through";
          nameEl.style.color = "#64748b";
        }
      }
    }

    // 6. Direct Action Handlers
    function triggerPhoneCall(buyerId, phone) {
      markBuyerAsContacted(buyerId);
      if (phone && phone !== 'No Contact') {
        window.location.href = `tel:${phone}`;
      } else {
        alert("No contact phone number recorded for this buyer.");
      }
    }

    function triggerWhatsApp(buyerId, buyerName, phone) {
      const matchObj = window.lastPipelineMatches.find(m => m.buyerId === buyerId);
      if (!matchObj || !matchObj.matchedItems.length) return;

      // Compile ALL matched produce lines into one WhatsApp message body
      const produceLines = matchObj.matchedItems
        .map(item => `• ${item.commodity} (${item.pack || ''} Size:${item.size || '*'}) - ${item.qty} available`)
        .join('\n');

      const msg = `Hello ${buyerName},\n\nWe have the following produce available for you today:\n${produceLines}\n\nAre you interested?`;

      markBuyerAsContacted(buyerId);

      // Clean phone number format for WhatsApp web/app
      let cleanPhone = String(phone).replace(/[^0-9]/g, '');
      if (cleanPhone.startsWith('0')) cleanPhone = '27' + cleanPhone.slice(1);

      const waUrl = cleanPhone 
        ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}` 
        : `https://wa.me/?text=${encodeURIComponent(msg)}`;

      window.open(waUrl, '_blank');
    }
  </script>
</body>
</html>
