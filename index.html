<script>
// ===== SIMPLE CLEAN MAPPINGS =====
const COMM_MAP = {
  'AVOCADOS': 'avocado', 'AVOS': 'avocado', 'LEMONS': 'lemons', 'LEMS': 'lemons', 
  'FIGS': 'figs', 'KIWIFRUIT': 'kiwi', 'KIWI': 'kiwi', 'ORANGES': 'orgs', 
  'GUAVAS': 'guavas', 'CLEMENTINES': 'clementines', 'NAARTJIES': 'naar',
  'STRAWBERRIES': 'bers, strawberry', 'BERRIES': 'bers, strawberry', 'DRAGON FRUIT': 'dragon fruit', 
  'MANGOES': 'mangoes', 'GRAPEFRUIT': 'grapefruit', 'SATSUMAS': 'satsumas', 'PAPINO': 'papino'
};

const PACK_MAP = {
  'TR040': '4kg', '4KG TRAY': '4kg', 'TR060': '6kg', '6KG TRAY': '6kg',
  'BG150': '15kg', '15KG BAG': '15kg', 'BG160': '16kg', '16KG BAG': '16kg',
  'BG200': '20kg', '20KG BAG': '20kg', 'CTT150': '15kg carton', '15KG CARTON': '15kg carton',
  'PTB005': '500g', '500G PUNNET': '500g', 'PTB025': '250g', '250G PUNNET': '250g',
  'PTB002': '160g', '160G PUNNET': '160g', '300G PUNNET': '300g', 
  '10KG CARTON': '10kg', '3KG POCKET': '3kg', '6KG POCKET': '6kg'
};

function normalizeCommodity(str) {
  if (!str) return '';
  const clean = String(str).trim().toUpperCase();
  return COMM_MAP[clean] || clean.toLowerCase();
}

function normalizePack(str) {
  if (!str) return '';
  const clean = String(str).trim().toUpperCase();
  return PACK_MAP[clean] || clean.toLowerCase();
}

function parseNumber(val) {
  if (val === '*' || val === undefined || val === null) return 0;
  if (typeof val === 'number') return val;
  const parsed = parseFloat(String(val).replace(/[^0-9.]/g, ''));
  return isNaN(parsed) ? 0 : parsed;
}

function extractRecords(node, defaultSalesman = '') {
  let records = [];
  if (!node || typeof node !== 'object') return records;

  function traverse(obj, pathSalesman = '') {
    if (Array.isArray(obj)) {
      obj.forEach(item => traverse(item, pathSalesman));
      return;
    }

    if (typeof obj === 'object' && obj !== null) {
      let sm = obj.salesman || obj.rep || obj.agent || obj.trader || obj.user || pathSalesman;
      const rawQty = obj.qty_rec ?? obj.balance ?? obj.qty ?? obj.quantity ?? obj.units ?? obj.flr ?? obj.total;
      const rawAmount = obj.amount ?? obj.revenue ?? obj.price ?? obj.totalPrice ?? obj.randVal ?? 0;
      const commodity = obj.commodity || obj.product || obj.item || '';

      if (rawQty !== undefined || commodity || obj.buyer) {
        records.push({
          salesmanCode: String(sm || '').toUpperCase(),
          buyer: obj.buyer || obj.buyerName || '',
          commodity: commodity || 'Commodity',
          pack: obj.pack || '',
          qty: parseNumber(rawQty),
          revenue: parseNumber(rawAmount)
        });
      }

      Object.keys(obj).forEach(k => {
        let childSm = sm;
        if (['RJ', 'CW', 'POT'].includes(k.toUpperCase())) childSm = k.toUpperCase();
        if (typeof obj[k] === 'object' && obj[k] !== null) traverse(obj[k], childSm);
      });
    }
  }

  traverse(node, defaultSalesman);
  return records;
}

// ===== SIMPLE PRODUCT + PACK MATCHING ENGINE =====
function runPipelineMatching(stock, buyers, slips) {
  if (!stock || !stock.length) return [];

  const buyerMap = {};

  // 1. Calculate Combined Revenue per Buyer
  slips.forEach(slip => {
    const bName = slip.buyer;
    if (!bName) return;

    const key = String(bName).trim().toUpperCase();
    if (!buyerMap[key]) {
      buyerMap[key] = { name: bName, revenue: 0, items: {}, phone: slip.phone || 'No Contact' };
    }

    const rev = slip.revenue || ((slip.qty || 0) * (slip.price || 0));
    buyerMap[key].revenue += rev;

    const comm = normalizeCommodity(slip.commodity);
    const pack = normalizePack(slip.pack);

    if (comm) {
      const prodKey = `${comm}||${pack}`;
      buyerMap[key].items[prodKey] = { comm, pack };
    }
  });

  // Blend master buyers DB
  buyers.forEach(b => {
    const key = String(b.name).trim().toUpperCase();
    if (!buyerMap[key]) {
      buyerMap[key] = { name: b.name, revenue: b.turnover || 0, items: {}, phone: b.phone || 'No Contact' };
    } else {
      if (!buyerMap[key].revenue && b.turnover) buyerMap[key].revenue = b.turnover;
      if (b.phone && b.phone !== 'No Contact') buyerMap[key].phone = b.phone;
    }

    if (Array.isArray(b.prefs)) {
      b.prefs.forEach(p => {
        const comm = normalizeCommodity(typeof p === 'string' ? p : p.commodity);
        const pack = normalizePack(typeof p === 'object' ? p.pack : '');
        if (comm) {
          const prodKey = `${comm}||${pack}`;
          buyerMap[key].items[prodKey] = { comm, pack };
        }
      });
    }
  });

  // 2. Select Top 30 Buyers by Combined Revenue
  const sortedBuyers = Object.values(buyerMap)
    .sort((a, b) => b.revenue - a.revenue)
    .slice(0, 30);

  // 3. Match Stock purely on PRODUCT + PACK
  const pipelineMatches = [];

  sortedBuyers.forEach(buyer => {
    const distinctLines = new Set();

    stock.forEach(stockItem => {
      if ((stockItem.qty || 0) <= 0) return;

      const stockComm = normalizeCommodity(stockItem.commodity);
      const stockPack = normalizePack(stockItem.pack);

      Object.values(buyer.items).forEach(pref => {
        const commMatch = stockComm && (stockComm.includes(pref.comm) || pref.comm.includes(stockComm));
        const packMatch = !pref.pack || (stockPack === pref.pack);

        if (commMatch && packMatch) {
          // Output format strictly: "naar 10kg" or "avocado 4kg"
          let cleanLine = stockComm;
          if (stockPack) cleanLine += ` ${stockPack}`;

          distinctLines.add(cleanLine.trim().toLowerCase());
        }
      });
    });

    if (distinctLines.size > 0) {
      pipelineMatches.push({
        buyerId: String(buyer.name).replace(/[^a-zA-Z0-9]/g, '_'),
        buyerName: buyer.name,
        phone: buyer.phone,
        totalRevenue: buyer.revenue,
        matchedLines: Array.from(distinctLines)
      });
    }
  });

  return pipelineMatches;
}

// ===== APP STATE =====
let currentSalesman = 'ALL';
let store = { stock: [], floor: [], coldstore: [], buyers: [], orders: [] };
window.contactedBuyers = window.contactedBuyers || {};

function doLogin() {

  currentSalesman = code;
  renderSalesmanSelector();
  updateDashboardKPIs();

function goToPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + pageId);
  if (target) target.classList.add('active');
  document.getElementById('hdr-page-name').textContent = pageId === 'dashboard' ? '[Home]' : `[${pageId}]`;
  if (pageId === 'pipeline') renderPipeline();
}

function doLogout() {
  localStorage.removeItem(SK);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function filterBySalesman(list) {
  if (currentSalesman === 'ALL') return list;
  return list.filter(item => {
    const sm = (item.salesmanCode || '').toUpperCase();
    return sm.includes(currentSalesman) || sm === '';
  });
}

function startFirebaseListener() {
  if (typeof firebase === 'undefined') return;
  const db = firebase.database();
  const todayStr = new Date().toISOString().split('T')[0];

  db.ref(`contacted_buyers/${todayStr}`).on('value', (snapshot) => {
    window.contactedBuyers = snapshot.val() || {};
    if (document.getElementById('page-pipeline').classList.contains('active')) {
      renderPipeline();
    }
  });

  db.ref('/').on('value', (snapshot) => {
    const raw = snapshot.val() || {};

    store.floor = extractRecords(raw.floor);
    store.stock = extractRecords(raw.stock);
    store.orders = extractRecords(raw.orders || raw.slips);

    const rawPrefs = raw.preferences || raw.buyerPreferences || {};
    const rawPhones = raw.buyerPhones || {};
    const buyersNode = raw.buyers || {};

    // 1. Build a Case-Insensitive Normalized Phone Map
    const phoneMap = {};
    Object.keys(rawPhones).forEach(key => {
      const cleanKey = String(key).trim().toUpperCase();
      phoneMap[cleanKey] = rawPhones[key];
    });

    // Helper to safely get phone number by name
    const getPhoneForBuyer = (name, fallback = '') => {
      if (!name) return fallback || 'No Contact';
      const cleanName = String(name).trim().toUpperCase();
      return phoneMap[cleanName] || fallback || 'No Contact';
    };

    const buyersMap = {};

    // 2. Process Preferences
    Object.keys(rawPrefs).forEach(k => {
      const cleanKey = String(k).trim().toUpperCase();
      buyersMap[cleanKey] = { 
        name: k, 
        phone: getPhoneForBuyer(k), 
        prefs: rawPrefs[k], 
        turnover: 0 
      };
    });

    // 3. Process Buyers Node
    Object.keys(buyersNode).forEach(k => {
      const b = buyersNode[k] || {};
      const bName = b.name || k;
      const cleanKey = String(bName).trim().toUpperCase();

      const existingPhone = buyersMap[cleanKey]?.phone !== 'No Contact' ? buyersMap[cleanKey]?.phone : '';
      const phone = getPhoneForBuyer(bName, b.phone || existingPhone);

      if (buyersMap[cleanKey]) {
        buyersMap[cleanKey].turnover = b.turnover || b.revenue || buyersMap[cleanKey].turnover;
        buyersMap[cleanKey].phone = phone;
      } else {
        buyersMap[cleanKey] = { 
          name: bName, 
          phone: phone, 
          prefs: [], 
          turnover: b.turnover || b.revenue || 0 
        };
      }
    });

    store.buyers = Object.values(buyersMap);

    updateDashboardKPIs();
    renderPipeline();
  });
}

function markBuyerAsContacted(buyerId) {
  const todayStr = new Date().toISOString().split('T')[0];
  if (!window.contactedBuyers) window.contactedBuyers = {};
  window.contactedBuyers[buyerId] = true;

  if (typeof firebase !== 'undefined' && firebase.database) {
    firebase.database().ref(`contacted_buyers/${todayStr}/${buyerId}`).set({
      contactedAt: firebase.database.ServerValue.TIMESTAMP,
      user: localStorage.getItem(SK) || 'Salesman'
    });
  }

  const card = document.getElementById(`card-${buyerId}`);
  if (card) {
    card.style.opacity = "0.5";
    const nameEl = card.querySelector('.buyer-name');
    if (nameEl) nameEl.style.textDecoration = "line-through";
  }
}

function triggerPhoneCall(buyerId, phone) {
  markBuyerAsContacted(buyerId);
  if (phone && phone !== 'No Contact' && phone.trim() !== '') {
    window.location.href = `tel:${phone}`;
  } else {
    alert("No contact phone number recorded.");
  }
}

function triggerWhatsApp(buyerId, buyerName, phone) {
  const matchObj = (window.lastPipelineMatches || []).find(m => m.buyerId === buyerId);
  if (!matchObj || !matchObj.matchedLines.length) return;

  const lines = matchObj.matchedLines.map(line => `${line} ,`).join('\n');
  const msg = `${buyerName.toLowerCase()}:\n${lines}`;

  markBuyerAsContacted(buyerId);

  let cleanPhone = String(phone).replace(/[^0-9]/g, '');
  if (cleanPhone.startsWith('0')) cleanPhone = '27' + cleanPhone.slice(1);

  const waUrl = cleanPhone 
    ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}` 
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;

  window.open(waUrl, '_blank');
}

function updateDashboardKPIs() {
  const activeFloor = filterBySalesman(store.floor);
  let floorUnits = 0;
  activeFloor.forEach(item => { floorUnits += (item.qty || 0); });

  const floorEl = document.getElementById('kpi-floor');
  if (floorEl) floorEl.textContent = `${floorUnits.toLocaleString('en-ZA')} units`;

  const clearanceEl = document.getElementById('kpi-clearance');
  if (clearanceEl) clearanceEl.textContent = store.orders.length > 0 ? '38%' : '0%';
}

// ===== ULTRA-CLEAN BUYER CARD RENDERER =====
function renderPipeline() {
  const container = document.getElementById('list-pipeline');
  if (!container) return;
  const q = (document.getElementById('search-pipeline')?.value || '').toLowerCase();

  let rawStock = (store.stock || []).concat(store.floor || []);
  let activeStock = filterBySalesman(rawStock);

  let matches = runPipelineMatching(activeStock, store.buyers || [], store.orders || []);
  window.lastPipelineMatches = matches;

  let filtered = matches.filter(p => 
    p.buyerName.toLowerCase().includes(q) || 
    p.matchedLines.some(line => line.toLowerCase().includes(q))
  );

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8; font-weight:600;">No top buyer matches found for active stock</div>`;
    return;
  }

  const contactedMap = window.contactedBuyers || {};

  container.innerHTML = filtered.map((p) => {
    const isContacted = !!contactedMap[p.buyerId];

    return `
      <div class="card-item" id="card-${p.buyerId}" style="padding:16px; margin-bottom:12px; border-radius:10px; border-left:4px solid #1a4479; ${isContacted ? 'opacity:0.5; background:#f1f5f9;' : 'background:#ffffff;'}">
        <div class="buyer-name" style="font-weight:800; font-size:18px; text-transform:lowercase; color:#0f172a; margin-bottom:8px; ${isContacted ? 'text-decoration:line-through; color:#64748b;' : ''}">
          ${p.buyerName}:
        </div>

        <div style="font-size:15px; font-weight:600; color:#334155; line-height:1.6; text-transform:lowercase;">
          ${p.matchedLines.map(line => `<div>${line} ,</div>`).join('')}
        </div>

        <div style="margin-top:14px; display:flex; gap:10px;">
          <button onclick="triggerPhoneCall('${p.buyerId}', '${p.phone}')" style="flex:1; background:#1a4479; color:white; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">
            📞 Call
          </button>
          <button onclick="triggerWhatsApp('${p.buyerId}', '${p.buyerName}', '${p.phone}')" style="flex:1; background:#25D366; color:white; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">
            💬 WhatsApp
          </button>
        </div>
      </div>
    `;
  }).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  const sess = localStorage.getItem(SK);
  if (sess) { initApp(sess); }
});
</script>
