<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Clerk - SubTrop CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #f3f7f3; padding: 16px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #1e4d2b; color: #fff; padding: 16px 20px; border-radius: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 20px; }
        .clerk-badge { background: #c9882a; padding: 4px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; }
        .clerk-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .clerk-btn { padding: 10px 20px; border: 2px solid #1e4d2b; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 14px; }
        .clerk-btn.active { background: #1e4d2b; color: #fff; }
        .sale-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 8px rgba(30,77,43,0.10); border-left: 4px solid #c9882a; }
        .sale-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .buyer-name { font-size: 18px; font-weight: 800; color: #1e4d2b; }
        .sale-time { font-size: 12px; color: #6b7c6c; }
        .items-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
        .items-table th { background: #e8f5ec; padding: 8px 10px; text-align: left; font-size: 11px; text-transform: uppercase; color: #1e4d2b; }
        .items-table td { padding: 8px 10px; border-bottom: 1px solid #dde8de; }
        .items-table .seq { font-weight: 700; color: #1a4479; }
        .items-table .qty { font-weight: 700; }
        .items-table .price { font-weight: 700; color: #1e4d2b; }
        .total-row { font-weight: 700; background: #f8faf8; }
        .total-row td { padding: 10px; }
        .btn-done { background: #1e4d2b; color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; float: right; margin-top: 10px; }
        .btn-done:active { opacity: 0.8; }
        .empty { text-align: center; padding: 60px 20px; color: #6b7c6c; font-size: 16px; }
        .empty-icon { font-size: 48px; display: block; margin-bottom: 16px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .status-bar .count { background: #1e4d2b; color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .auto-refresh { font-size: 12px; color: #6b7c6c; text-align: center; margin-top: 20px; padding: 12px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .refresh-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3a7a4a; margin-right: 8px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 16px; }
            .items-table { font-size: 12px; }
            .items-table th, .items-table td { padding: 6px 6px; }
            .buyer-name { font-size: 15px; }
            .btn-done { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Booking Clerk</h1>
            <div class="clerk-badge" id="clerk-id">Clerk 1</div>
        </div>

        <div class="clerk-selector">
            <button class="clerk-btn active" onclick="setClerk(1)">👤 Clerk 1</button>
            <button class="clerk-btn" onclick="setClerk(2)">👤 Clerk 2</button>
            <button class="clerk-btn" onclick="setClerk(3)">👤 Clerk 3</button>
        </div>

        <div class="status-bar">
            <span>Pending Sales</span>
            <span class="count" id="sale-count">0</span>
        </div>

        <div id="sales-list">
            <div class="empty">
                <span class="empty-icon">🕐</span>
                No pending sales.<br>Waiting for orders from the floor...
            </div>
        </div>

        <div class="auto-refresh">
            <span class="refresh-dot"></span>
            Auto-refresh every 5 seconds
            <span id="last-update" style="margin-left:12px;color:#999;"></span>
        </div>
    </div>

    <script>
        const CONFIG = window.CONFIG || {
            FIREBASE_DATABASE_URL: 'https://jdw-crm-default-rtdb.firebaseio.com',
            FIREBASE_SECRET: '',
            SYNC_URL: 'https://jdw-sync.onrender.com'
        };

        const FB_DB = CONFIG.FIREBASE_DATABASE_URL;
        const FB_SECRET = CONFIG.FIREBASE_SECRET;
        let currentClerk = 1;

        function setClerk(id) {
            currentClerk = id;
            document.getElementById('clerk-id').textContent = 'Clerk ' + id;
            document.querySelectorAll('.clerk-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.clerk-btn')[id-1].classList.add('active');
            loadSales();
        }

        async function loadSales() {
            try {
                const response = await fetch(FB_DB + '/cart.json?auth=' + FB_SECRET);
                const data = await response.json();

                const pending = data ? Object.entries(data).filter(([key, sale]) => sale.status === 'pending') : [];

                document.getElementById('sale-count').textContent = pending.length;

                if (pending.length === 0) {
                    document.getElementById('sales-list').innerHTML = `
                        <div class="empty">
                            <span class="empty-icon">✨</span>
                            All caught up! No pending sales.
                        </div>
                    `;
                    return;
                }

                let html = '';
                pending.forEach(([key, sale]) => {
                    const total = sale.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
                    html += `
                        <div class="sale-card" id="sale-${key}">
                            <div class="sale-header">
                                <div class="buyer-name">${sale.buyer}</div>
                                <div class="sale-time">${new Date(sale.createdAt).toLocaleTimeString()}</div>
                            </div>
                            <table class="items-table">
                                <thead>
                                    <tr>
                                        <th>SEQ</th>
                                        <th>Commodity</th>
                                        <th>Producer</th>
                                        <th style="text-align:right">Qty</th>
                                        <th style="text-align:right">Price</th>
                                        <th style="text-align:right">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sale.items.map(item => `
                                        <tr>
                                            <td class="seq">${item.seq}</td>
                                            <td>${item.commodity}</td>
                                            <td>${item.producer || '-'}</td>
                                            <td style="text-align:right;font-weight:700">${item.qty}</td>
                                            <td style="text-align:right;font-weight:700">R ${item.price}</td>
                                            <td style="text-align:right;font-weight:700">R ${(item.qty * item.price).toLocaleString()}</td>
                                        </tr>
                                    `).join('')}
                                    <tr class="total-row">
                                        <td colspan="5" style="text-align:right">TOTAL:</td>
                                        <td style="text-align:right">R ${total.toLocaleString()}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <button class="btn-done" onclick="markDone('${key}')">✅ Done - Sale Completed</button>
                        </div>
                    `;
                });

                document.getElementById('sales-list').innerHTML = html;
                document.getElementById('last-update').textContent = 'Updated: ' + new Date().toLocaleTimeString();

            } catch (error) {
                console.error('Error loading sales:', error);
                document.getElementById('sales-list').innerHTML = `
                    <div class="empty">
                        <span class="empty-icon">⚠️</span>
                        Error loading sales: ${error.message}<br>
                        Check console for details.
                    </div>
                `;
            }
        }

        async function markDone(saleId) {
            if (!confirm('Mark this sale as completed?\nThis will subtract stock from floor balance.')) return;

            try {
                const response = await fetch(FB_DB + '/cart/' + saleId + '.json?auth=' + FB_SECRET);
                const sale = await response.json();

                for (const item of sale.items) {
                    await updateFloorBalance(item.seq, item.qty);
                }

                await fetch(FB_DB + '/cart/' + saleId + '.json?auth=' + FB_SECRET, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        status: 'done',
                        completedAt: new Date().toISOString(),
                        clerk: 'clerk' + currentClerk
                    })
                });

                await logSale(saleId, sale);
                loadSales();

                if (confirm('✅ Sale completed! Print packing slip for floor pickers?')) {
                    printPackingSlip(sale);
                }

            } catch (error) {
                alert('Error completing sale: ' + error.message);
            }
        }

        async function updateFloorBalance(seq, qty) {
            try {
                const floorRes = await fetch(FB_DB + '/floor.json?auth=' + FB_SECRET);
                const floorData = await floorRes.json();

                let found = false;
                for (const [salesman, lines] of Object.entries(floorData || {})) {
                    for (const [lineId, line] of Object.entries(lines || {})) {
                        if (line.seq == seq) {
                            const newBalance = Math.max(0, (line.balance || 0) - qty);
                            await fetch(FB_DB + '/floor/' + salesman + '/' + lineId + '.json?auth=' + FB_SECRET, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ balance: newBalance })
                            });
                            console.log('Updated SEQ ' + seq + ': ' + line.balance + ' → ' + newBalance);
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    console.warn('SEQ not found in floor balance:', seq);
                }
            } catch (error) {
                console.error('Error updating floor balance:', error);
            }
        }

        async function logSale(saleId, sale) {
            try {
                const total = sale.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
                await fetch(FB_DB + '/salesHistory.json?auth=' + FB_SECRET, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        saleId: saleId,
                        buyer: sale.buyer,
                        items: sale.items,
                        completedAt: new Date().toISOString(),
                        clerk: 'clerk' + currentClerk,
                        total: total
                    })
                });
                console.log('Sale logged to history');
            } catch (error) {
                console.error('Error logging sale:', error);
            }
        }

        function printPackingSlip(sale) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-ZA', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });

            const totalQty = sale.items.reduce((sum, item) => sum + item.qty, 0);
            const totalAmount = sale.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
            const orderId = sale.id.slice(-8);

            const printHTML = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Packing Slip - ${orderId}</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        font-family: 'Courier New', monospace;
                        font-size: 12px;
                        width: 80mm;
                        padding: 3mm 4mm;
                        margin: 0 auto;
                        background: #fff;
                    }
                    .header {
                        text-align: center;
                        border-bottom: 2px solid #000;
                        padding-bottom: 6px;
                        margin-bottom: 8px;
                    }
                    .header h1 {
                        font-size: 16px;
                        font-weight: 800;
                        letter-spacing: 2px;
                    }
                    .header .sub {
                        font-size: 10px;
                        color: #666;
                        margin-top: 2px;
                    }
                    .info-row {
                        display: flex;
                        justify-content: space-between;
                        padding: 2px 0;
                        border-bottom: 1px dashed #ccc;
                        font-size: 11px;
                    }
                    .info-row .label {
                        font-weight: 700;
                    }
                    .buyer-section {
                        background: #f5f5f5;
                        padding: 6px 8px;
                        margin: 8px 0;
                        border-left: 3px solid #1e4d2b;
                    }
                    .buyer-section .buyer-name {
                        font-size: 14px;
                        font-weight: 800;
                    }
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        margin: 6px 0;
                        font-size: 10px;
                    }
                    table th {
                        background: #1e4d2b;
                        color: #fff;
                        padding: 4px 4px;
                        text-align: left;
                        font-size: 9px;
                        text-transform: uppercase;
                        letter-spacing: 0.5px;
                    }
                    table td {
                        padding: 4px 4px;
                        border-bottom: 1px dotted #ddd;
                    }
                    .text-right { text-align: right; }
                    .totals {
                        margin-top: 8px;
                        padding-top: 8px;
                        border-top: 2px solid #000;
                    }
                    .totals-row {
                        display: flex;
                        justify-content: space-between;
                        font-size: 12px;
                        padding: 2px 0;
                    }
                    .totals-row.grand {
                        font-size: 14px;
                        font-weight: 800;
                        border-top: 2px solid #000;
                        padding-top: 4px;
                        margin-top: 4px;
                    }
                    .footer {
                        text-align: center;
                        font-size: 9px;
                        color: #999;
                        margin-top: 12px;
                        padding-top: 8px;
                        border-top: 2px solid #000;
                    }
                    .footer .barcode {
                        font-size: 20px;
                        letter-spacing: 2px;
                        font-weight: 700;
                        font-family: 'Courier New', monospace;
                    }
                    .packing-note {
                        font-size: 9px;
                        color: #666;
                        text-align: center;
                        margin-top: 6px;
                        padding: 4px;
                        background: #f9f9f9;
                        border-radius: 3px;
                    }
                    @media print {
                        body { margin: 0; padding: 2mm; }
                        .no-print { display: none; }
                        @page { margin: 0; size: 80mm auto; }
                    }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>🛒 PACKING SLIP</h1>
                    <div class="sub">SubTrop RSA Market</div>
                </div>

                <div class="info-row">
                    <span class="label">Order #:</span>
                    <span>${orderId}</span>
                </div>
                <div class="info-row">
                    <span class="label">Date:</span>
                    <span>${dateStr} ${timeStr}</span>
                </div>
                <div class="info-row">
                    <span class="label">Clerk:</span>
                    <span>Clerk ${currentClerk}</span>
                </div>

                <div class="buyer-section">
                    <div class="buyer-name">👤 ${sale.buyer}</div>
                    <div style="font-size:10px;color:#666;margin-top:2px;">${sale.items.length} item(s) · ${totalQty} units total</div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width:15%">SEQ</th>
                            <th style="width:25%">Commodity</th>
                            <th style="width:20%">Producer</th>
                            <th style="width:15%">Pack</th>
                            <th style="width:10%">CL</th>
                            <th style="width:8%;text-align:right">Qty</th>
                            <th style="width:12%;text-align:right">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sale.items.map(item => `
                            <tr>
                                <td>${item.seq}</td>
                                <td>${item.commodity}</td>
                                <td>${item.producer || '-'}</td>
                                <td>${item.pack || '-'}</td>
                                <td>${item.grade || '-'}</td>
                                <td class="text-right">${item.qty}</td>
                                <td class="text-right">R${item.price}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <div class="totals">
                    <div class="totals-row">
                        <span>Total Items:</span>
                        <span>${totalQty}</span>
                    </div>
                    <div class="totals-row grand">
                        <span>TOTAL:</span>
                        <span>R ${totalAmount.toFixed(2)}</span>
                    </div>
                </div>

                <div class="packing-note">
                    📦 Please pack carefully · Handle with care
                </div>

                <div class="footer">
                    <div class="barcode">|||${orderId}|||</div>
                    <div style="margin-top:4px;">Thank you for your order!</div>
                </div>

                <div class="no-print" style="text-align:center;margin-top:20px;padding:12px;background:#f0f0f0;border-radius:8px;">
                    <button onclick="window.print()" style="padding:10px 30px;font-size:14px;font-weight:700;background:#1e4d2b;color:#fff;border:none;border-radius:8px;cursor:pointer;">
                        🖨️ Print
                    </button>
                    <button onclick="window.close()" style="padding:10px 20px;font-size:14px;background:#ccc;border:none;border-radius:8px;cursor:pointer;margin-left:8px;">
                        Close
                    </button>
                </div>
            </body>
            </html>
            `;

            const win = window.open('', '_blank', 'width=400,height=700,scrollbars=yes');
            if (win) {
                win.document.write(printHTML);
                win.document.close();
                win.focus();
            } else {
                alert('Please allow pop-ups for this site to print packing slips.');
            }
        }

        setInterval(loadSales, 5000);
        loadSales();
    </script>
</body>
</html>
